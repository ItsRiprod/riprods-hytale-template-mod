# Gradle
org.gradle.daemon                    = true
org.gradle.jvmargs                   = -Xmx3G
org.gradle.parallel                  = true
org.gradle.caching                   = true

# Common
java_version                         = 25
hytale_version                       = 0.+
manifestServerVersion                = >=0.7.0 <0.8.0
release_type                         = RELEASE
maven_url                            = https://maven.azuredoom.com/mods
hmod_maven_url                       = https://maven.hytalemodding.dev/releases
hmod_maven_snapshot_url              = https://maven.hytalemodding.dev/snapshots
maven_group_id                       = com.riprod
maven_artifact_id                    = template

# Publishing: fill in an ID, then set enabled = true for that platform in build.gradle
modtale_uuid                         =
modifold_id                          =
curseforgeID                         =

# Mod options
group                                = com.riprod.template
manifest_group                       = Riprod
mod_name                             = Template
main_class                           = com.riprod.template.Template
mod_author                           = Riprod
mod_id                               = Template
mod_license                          = MIT
mod_description                      = __DESCRIPTION__
mod_credits                          = Riprod
mod_logo                             = icon-256.png
mod_url                              = https://github.com/itsriprod/Template
mod_issues                           = https://github.com/itsriprod/Template/issues
mod_sources                          = https://github.com/itsriprod/Template
version                              = 0.1.0
# Set to true once the mod ships assets under src/main/resources/Common or Server
includes_pack                        = false
disabled_by_default                  = false
patchline                            = release
load_user_mods                       = false
manifest_dependencies                =
manifest_opt_dependencies            =
